<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1024 大厦 · 全社区正在盖的那座楼</title>
<meta name="description" content="1024 大厦：把全社区的盖楼帖盖成一座真的楼。每一条回帖就是一层，楼随回帖实时生长，一起盖到 1024 层。">
<style>
  :root{
    --bg0:#05081A; --bg1:#0B1130;
    --gold:#F5C04A; --gold2:#FFE9A8; --gold-dark:#B8892B;
    --text:#EDF0FF; --muted:#8B94C4; --dim:#5A6390;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,var(--bg0) 0%,var(--bg1) 100%);
    color:var(--text);overflow-x:hidden;
  }
  #bg{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
  #tower{
    position:fixed;top:0;right:0;width:52vw;height:100vh;z-index:1;pointer-events:auto;cursor:pointer;
    -webkit-mask-image:linear-gradient(to right,#000 34%,rgba(0,0,0,.5) 66%,transparent 97%);
            mask-image:linear-gradient(to right,#000 34%,rgba(0,0,0,.5) 66%,transparent 97%);
  }
  #avatars{position:fixed;top:0;right:0;width:52vw;height:100vh;z-index:1;pointer-events:none}
  #space{position:relative;z-index:-1}

  #panel{
    position:fixed;left:0;top:0;bottom:0;width:46vw;min-width:430px;z-index:2;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:5.5vh 2.5vw 4.5vh 4vw;pointer-events:none;
  }
  #panel .inner{pointer-events:auto;max-width:520px}

  .brandline{display:flex;align-items:baseline;gap:14px}
  .brand{font-size:15px;font-weight:800;letter-spacing:6px;color:var(--gold2)}

  .now-num{
    font-size:clamp(72px,9.5vw,124px);font-weight:200;line-height:1;letter-spacing:2px;
    background:linear-gradient(180deg,var(--gold2),var(--gold) 70%,var(--gold-dark));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-variant-numeric:tabular-nums;
  }
  .now-row{display:flex;align-items:flex-end;gap:12px;margin-top:10px}
  .now-unit{font-size:15px;color:var(--muted);padding-bottom:14px}
  .now-tag{
    font-size:11.5px;color:var(--gold2);border:1px solid var(--gold-dark);
    border-radius:999px;padding:3px 12px;margin-bottom:12px;letter-spacing:1px;
  }
  .now-who{display:flex;align-items:center;gap:10px;margin-top:6px;min-height:34px}
  .now-who img{width:30px;height:30px;border-radius:50%;border:1px solid var(--gold-dark)}
  .now-who .nm{font-size:14.5px;font-weight:700}
  .now-who .tm{font-size:11.5px;color:var(--dim);margin-left:6px}
  .now-who .lk{font-size:11.5px;color:var(--gold-dark);margin-left:8px}
  .now-txt{
    margin-top:10px;font-size:13.5px;color:var(--muted);line-height:1.75;
    max-height:70px;overflow:hidden;
  }
  .vbadge{
    display:inline-block;font-size:10.5px;color:#7ED99A;border:1px solid #3E6B52;
    border-radius:6px;padding:1px 7px;margin-left:8px;vertical-align:2px;
  }
  .gone-note{font-size:13px;color:var(--dim);margin-top:10px}

  .stats{display:flex;gap:34px;margin-top:26px;padding-top:20px;border-top:1px solid rgba(39,50,95,.55)}
  .stat .v{font-size:22px;font-weight:700;color:var(--gold2);font-variant-numeric:tabular-nums}
  .stat .k{font-size:11.5px;color:var(--dim);margin-top:2px}

  .eta{margin-top:14px;font-size:12.5px;color:var(--muted);min-height:20px}
  .latenight{margin-top:6px;font-size:12px;color:rgba(245,192,74,.55)}
  .fornote{margin-top:6px;font-size:12px;color:var(--muted)}

  .search-row{display:flex;gap:10px;margin-top:24px}
  .search-row input{
    flex:1;background:rgba(14,20,48,.6);border:1.5px solid #27325F;border-radius:12px;color:var(--text);
    padding:11px 14px;font-size:13.5px;font-family:inherit;
  }
  .search-row input:focus{outline:none;border-color:var(--gold-dark)}
  .search-row input::placeholder{color:var(--dim)}

  .lucky-row{display:flex;gap:8px;margin-top:14px}
  .lucky-row button{
    background:rgba(14,20,48,.6);border:1px solid #27325F;color:var(--muted);
    border-radius:10px;font-size:12.5px;padding:7px 0;flex:1;font-family:inherit;cursor:pointer;
    transition:border-color .15s,color .15s;
  }
  .lucky-row button:hover{border-color:var(--gold);color:var(--gold2)}
  .lucky-row button.built{border-color:var(--gold-dark);color:var(--gold2)}

  .cta-row{display:flex;gap:10px;align-items:center;margin-top:22px}
  .btn-gold{
    background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2A1E04;font-size:14px;
    padding:12px 24px;border-radius:12px;font-weight:700;border:none;cursor:pointer;text-decoration:none;display:inline-block;
    box-shadow:0 6px 18px rgba(245,192,74,.22);
  }
  .btn-gold:hover{transform:translateY(-1px)}

  .hint{font-size:12px;color:var(--dim);margin-top:16px;line-height:1.8}
  .hint b{color:var(--muted);font-weight:600}

  #toast{
    position:fixed;left:23vw;bottom:30px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:#1A2350;border:1px solid var(--gold-dark);color:var(--gold2);font-size:13px;
    padding:10px 20px;border-radius:12px;z-index:60;transition:all .25s;pointer-events:none;
    max-width:60vw;text-align:center;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:760px){
    #tower,#avatars{width:100vw;height:54vh;top:auto;bottom:0}
    #tower{
      -webkit-mask-image:linear-gradient(to top,#000 30%,rgba(0,0,0,.5) 62%,transparent 96%);
              mask-image:linear-gradient(to top,#000 30%,rgba(0,0,0,.5) 62%,transparent 96%);
    }
    #panel{width:100vw;min-width:0;bottom:auto;height:46vh;padding:3.5vh 6vw 1vh;overflow:hidden}
    .stats{gap:22px;margin-top:14px;padding-top:12px}
    .search-row,.lucky-row{display:none}
    .now-txt{max-height:34px}
    #toast{left:50vw;bottom:56vh}
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="tower"></canvas>
<canvas id="avatars"></canvas>

<div id="panel">
  <div class="inner brandline">
    <span class="brand">1024 大厦</span>
  </div>

  <div class="inner">
    <div class="now-row">
      <span class="now-num" id="nowN">–</span>
      <span class="now-unit">层</span>
      <span class="now-tag" id="nowTag"></span>
    </div>
    <div class="now-who" id="nowWho"></div>
    <div class="now-txt" id="nowTxt"></div>
    <div class="gone-note" id="nowGone" style="display:none"></div>

    <div class="stats">
      <div class="stat"><div class="v" id="stTop">–</div><div class="k">现存楼层</div></div>
      <div class="stat"><div class="v" id="stU">–</div><div class="k">盖楼人数</div></div>
      <div class="stat"><div class="v" id="stV">–</div><div class="k">有效模板层</div></div>
      <div class="stat"><div class="v" id="stLeft">–</div><div class="k">封顶还差</div></div>
    </div>
    <div class="eta" id="eta"></div>

    <div class="search-row">
      <input id="q" placeholder="输入昵称，找到你的楼层" onkeydown="if(event.key==='Enter')doSearch()">
      <button class="btn-gold" style="padding:11px 20px" onclick="doSearch()">找楼层</button>
    </div>
    <div class="lucky-row" id="luckyRow"></div>
  </div>

  <div class="inner">
    <div class="cta-row">
      <a class="btn-gold" href="https://forum.trae.cn/t/topic/325833" target="_blank">去盖楼，占一层</a>
    </div>
    <div class="hint">
      右边这栋楼就是滚动条：<b>滚到页面最顶，站在楼顶的最新一层；滚到最底，回到第 1 层；点楼上的任意位置，直接跳到那一层</b>。楼右缘的圆头像就是每层住户，左边的信息跟着你所在楼层变。
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="space"></div>

const FLOORS = SNAPSHOT.floors.slice().sort(function(a,b){return a.n-b.n;});
const BYN = {};
FLOORS.forEach(function(f){ BYN[f.n]=f; });
let TOPN = FLOORS.length ? FLOORS[FLOORS.length-1].n : 0;
const GONE = [];
(function(){
  var have={};
  FLOORS.forEach(function(f){ have[f.n]=1; });
  for(var i=1;i<=TOPN;i++){ if(!have[i]) GONE[i]=1; }
})();
let UNIQUE = (function(){ var s={}; FLOORS.forEach(function(f){s[f.u]=1;}); return Object.keys(s).length; })();
const VALID_RE=/我\s*是\s*1024\s*Builder/i;
FLOORS.forEach(function(f){ f._v=VALID_RE.test(f.x||''); });
let VALID_N=FLOORS.filter(function(f){return f._v;}).length;
const LUCKY=[128,256,512,1024];
const PXF=9;

function etaText(){
  if(TOPN>=1024) return '已封顶';
  var now=new Date(), day=86400000, recent=0;
  FLOORS.forEach(function(f){ if(now-new Date(f.t)<=day) recent++; });
  if(recent<6) return '';
  var left=1024-TOPN, perH=recent/24;
  var hours=Math.max(0.5,left/perH);
  var eta=new Date(now.getTime()+hours*3600000);
  if(hours>96) return '最近 24 小时新盖 '+recent+' 层，照这个速度预计 '+(eta.getMonth()+1)+' 月 '+eta.getDate()+' 日封顶，冲刺一波能快不少';
  return '照最近 24 小时的施工速度，预计 '+(eta.getMonth()+1)+' 月 '+eta.getDate()+' 日 '+eta.getHours()+' 点前后封顶';
}
function fmtT(iso){
  if(!iso) return '';
  var d=new Date(iso);
  var p=function(x){return (x<10?'0':'')+x;};
  return (d.getMonth()+1)+'-'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function nameOf(f){ return f.nm || f.u; }
function $(id){ return document.getElementById(id); }
function toast(msg, ms){
  var t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('show'); }, ms||2600);
}

var fornote=null;
function refreshStats(){
  $('stTop').textContent=FLOORS.length;
  var gone=TOPN-FLOORS.length;
  if(!fornote){
    fornote=document.createElement('div');
    fornote.className='fornote';
    $('eta').after(fornote);
  }
  fornote.textContent='楼号跟帖子楼层一一对应，被删除的回复会留下空号：现在最高盖到 '+TOPN+' 号楼，现存 '+FLOORS.length+' 层，拆除 '+gone+' 层。';
  $('stU').textContent=UNIQUE;
  $('stV').textContent=VALID_N;
  $('stLeft').textContent=1024-TOPN;
  $('eta').textContent=etaText();
}
refreshStats();
function maybeLateNight(){
  var h=new Date().getHours();
  if(h>=0&&h<5){
    var d=document.createElement('div');
    d.className='latenight';
    d.textContent='这个点还没睡？楼不会跑。';
    $('eta').after(d);
  }
}
maybeLateNight();

function layoutSpace(){
  $('space').style.height = Math.round((TOPN-1)*PXF + innerHeight*1.15) + 'px';
}
function maxScroll(){
  return Math.max(1, document.body.scrollHeight - innerHeight);
}
function curFloorNow(){
  var m=maxScroll();
  var prog=Math.min(1,Math.max(0,(window.scrollY||window.pageYOffset||0)/m));
  return TOPN - prog*(TOPN-1);
}
function scrollToFloor(n){
  n=Math.max(1,Math.min(TOPN,Math.round(n)));
  var target=(TOPN-n)/(TOPN-1)*maxScroll();
  window.scrollTo({top:target,behavior:'smooth'});
}

/* 背景星空 */
var bc=$('bg'), bctx=bc.getContext('2d');
var stars=[];
function sizeBg(){
  var DPR=window.devicePixelRatio||1;
  bc.width=innerWidth*DPR; bc.height=innerHeight*DPR;
  bctx.setTransform(DPR,0,0,DPR,0,0);
  stars=[];
  for(var i=0;i<240;i++){
    stars.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight*0.85,r:Math.random()*1.2+0.25,p:Math.random()*Math.PI*2,s:0.4+Math.random()*0.8});
  }
  var g=bctx.createRadialGradient(innerWidth*0.72,innerHeight*0.62,0,innerWidth*0.72,innerHeight*0.62,innerHeight*0.7);
  g.addColorStop(0,'rgba(245,192,74,0.05)');
  g.addColorStop(1,'rgba(245,192,74,0)');
  bctx.fillStyle=g; bctx.fillRect(0,0,innerWidth,innerHeight);
}
function drawStars(){
  bctx.clearRect(0,0,innerWidth,innerHeight);
  var g=bctx.createRadialGradient(innerWidth*0.72,innerHeight*0.62,0,innerWidth*0.72,innerHeight*0.62,innerHeight*0.7);
  g.addColorStop(0,'rgba(245,192,74,0.05)');
  g.addColorStop(1,'rgba(245,192,74,0)');
  bctx.fillStyle=g; bctx.fillRect(0,0,innerWidth,innerHeight);
  var t=Date.now()/1000;
  stars.forEach(function(st){
    var a=0.25+0.55*Math.abs(Math.sin(t*st.s+st.p));
    bctx.fillStyle='rgba(237,240,255,'+a.toFixed(2)+')';
    bctx.beginPath(); bctx.arc(st.x,st.y,st.r,0,6.283); bctx.fill();
  });
  drawMoon();
  drawMeteors();
}

/* 月亮与流星 */
var meteors=[];
function moonPos(){
  var cur=curFloorNow();
  return {
    x:innerWidth*0.80,
    y:innerHeight*0.11+(1-cur/TOPN)*innerHeight*0.045,
    r:Math.min(innerWidth,innerHeight)*0.048
  };
}
function drawMoon(){
  var m=moonPos();
  var halo=bctx.createRadialGradient(m.x,m.y,m.r*0.4,m.x,m.y,m.r*2.4);
  halo.addColorStop(0,'rgba(240,230,198,.18)');
  halo.addColorStop(1,'rgba(240,230,198,0)');
  bctx.fillStyle=halo;
  bctx.beginPath(); bctx.arc(m.x,m.y,m.r*2.4,0,6.283); bctx.fill();
  bctx.fillStyle='#EFE6C6';
  bctx.beginPath(); bctx.arc(m.x,m.y,m.r,0,6.283); bctx.fill();
  bctx.fillStyle='rgba(120,110,80,.18)';
  bctx.beginPath(); bctx.arc(m.x-m.r*0.32,m.y-m.r*0.18,m.r*0.22,0,6.283); bctx.fill();
  bctx.beginPath(); bctx.arc(m.x+m.r*0.25,m.y+m.r*0.30,m.r*0.15,0,6.283); bctx.fill();
  bctx.beginPath(); bctx.arc(m.x+m.r*0.05,m.y-m.r*0.45,m.r*0.10,0,6.283); bctx.fill();
}
function spawnMeteor(){
  var m=moonPos();
  meteors.push({
    x0:m.x-m.r*0.3, y0:m.y+m.r*0.4,
    vx:-(240+Math.random()*120), vy:130+Math.random()*80,
    born:Date.now()
  });
}
function drawMeteors(){
  var now=Date.now();
  meteors=meteors.filter(function(mt){ return now-mt.born<1100; });
  meteors.forEach(function(mt){
    var p=(now-mt.born)/1100;
    var x=mt.x0+mt.vx*p*1.1, y=mt.y0+mt.vy*p*1.1;
    var tx=mt.x0+mt.vx*(p-0.22)*1.1, ty=mt.y0+mt.vy*(p-0.22)*1.1;
    var lg=bctx.createLinearGradient(x,y,tx,ty);
    lg.addColorStop(0,'rgba(255,244,214,'+(0.9*(1-p)).toFixed(2)+')');
    lg.addColorStop(1,'rgba(255,244,214,0)');
    bctx.strokeStyle=lg; bctx.lineWidth=2; bctx.lineCap='round';
    bctx.beginPath(); bctx.moveTo(x,y); bctx.lineTo(tx,ty); bctx.stroke();
    bctx.fillStyle='rgba(255,250,230,'+(0.95*(1-p)).toFixed(2)+')';
    bctx.beginPath(); bctx.arc(x,y,1.8,0,6.283); bctx.fill();
  });
}

/* 右侧楼体 */
var tc=$('tower'), tctx=tc.getContext('2d');
var ac=$('avatars'), actx=ac.getContext('2d');
var TW=0,TH=0;
function sizeTower(){
  var DPR=window.devicePixelRatio||1;
  TW=tc.clientWidth; TH=tc.clientHeight;
  tc.width=TW*DPR; tc.height=TH*DPR;
  tctx.setTransform(DPR,0,0,DPR,0,0);
  ac.width=TW*DPR; ac.height=TH*DPR;
  actx.setTransform(DPR,0,0,DPR,0,0);
}
function geom(){
  return {
    FH:Math.max(20,Math.min(30,Math.round(TH/34))),
    bx0:Math.round(TW*0.10),
    bx1:Math.round(TW*0.88),
    anchorY:Math.round(TH*0.40)
  };
}
function seed(n,c){
  var v=Math.sin(n*127.1+c*311.7)*43758.5453;
  return v-Math.floor(v);
}
function drawTower(){
  tctx.clearRect(0,0,TW,TH);
  var cur=curFloorNow();
  var g=geom();
  var FH=g.FH, bx0=g.bx0, bx1=g.bx1, anchorY=g.anchorY, bw=bx1-bx0;
  function yOf(n){ return anchorY+(cur-n)*FH; }

  var nTopView=Math.ceil(anchorY/FH)+Math.ceil(cur);
  var nBotView=Math.floor(cur-(TH-anchorY)/FH)-1;
  var drawTop=Math.min(nTopView,1024), drawBot=Math.max(1,nBotView);

  /* 楼体底色（建成段） */
  var bodyTopY=yOf(Math.min(drawTop,TOPN))-FH/2;
  var bodyBotY=yOf(Math.max(drawBot,1))+FH/2;
  if(bodyBotY>bodyTopY){
    var grad=tctx.createLinearGradient(0,bodyTopY,0,Math.min(bodyBotY,TH));
    grad.addColorStop(0,'#161D42');
    grad.addColorStop(1,'#1E2755');
    tctx.fillStyle=grad;
    tctx.fillRect(bx0,bodyTopY,bw,Math.min(bodyBotY,TH)-bodyTopY);
    tctx.fillStyle='rgba(245,192,74,.14)';
    tctx.fillRect(bx0,bodyTopY,2,Math.min(bodyBotY,TH)-bodyTopY);
  }

  /* 未建脚手架 */
  var scTop=yOf(drawTop), scBot=yOf(TOPN);
  if(scBot>scTop){
    tctx.strokeStyle='rgba(139,148,196,.28)';
    tctx.setLineDash([4,5]); tctx.lineWidth=1;
    tctx.strokeRect(bx0,scTop,bw,scBot-scTop);
    tctx.beginPath();
    for(var sy=scTop+10; sy<scBot-4; sy+=14){
      tctx.moveTo(bx0,sy); tctx.lineTo(bx0+bw,sy);
    }
    tctx.stroke();
    tctx.setLineDash([]);
  }

  /* 逐层窗户 */
  var cols=6, gap=5;
  var ww=(bw-gap*(cols+1))/cols;
  var curInt=Math.round(cur);
  for(var n=Math.max(1,drawBot); n<=Math.min(drawTop,TOPN); n++){
    var y=yOf(n)-FH/2;
    var gone=GONE[n];
    var mile=n>0 && n%100===0;
    var lucky=LUCKY.indexOf(n)>=0;
    if(mile){
      tctx.fillStyle='rgba(245,192,74,.30)';
      tctx.fillRect(bx0,y+1,bw,FH-2);
    }
    if(gone){
      tctx.strokeStyle='rgba(90,99,144,.35)';
      tctx.setLineDash([3,3]); tctx.lineWidth=1;
      tctx.strokeRect(bx0+10,y+4,bw-20,FH-8);
      tctx.setLineDash([]);
      continue;
    }
    var lit=0;
    for(var c=0;c<cols;c++){
      var s=seed(n,c);
      if(s<0.22){ continue; }
      var a=0.35+s*0.5;
      var warm=seed(n,c+40)>0.82;
      var valid=BYN[n] && BYN[n]._v;
      var alpha=valid?Math.min(1,a+0.22):a;
      tctx.fillStyle=warm?'rgba(245,192,74,'+alpha.toFixed(2)+')':'rgba(255,217,122,'+alpha.toFixed(2)+')';
      var wx=bx0+gap+c*(ww+gap);
      tctx.fillRect(wx,y+FH*0.24,ww,FH*0.40);
      lit++;
    }
    if(lucky){
      tctx.fillStyle='rgba(245,192,74,.9)';
      tctx.fillRect(bx0,y-1.5,bw,2.5);
      tctx.fillRect(bx0,y+FH-1,bw,2.5);
    }
    if(n===curInt){
      tctx.fillStyle='rgba(255,233,168,.10)';
      tctx.fillRect(bx0,y,bw,FH);
      tctx.fillStyle='rgba(255,233,168,.85)';
      tctx.fillRect(bx0-4,y+2,2,FH-4);
    }
    if(mile||lucky||n===curInt||n%25===0){
      tctx.fillStyle=n===curInt?'rgba(255,233,168,.95)':'rgba(139,148,196,.7)';
      tctx.font=(n===curInt?'700 11px':'500 10px')+' -apple-system,PingFang SC,sans-serif';
      tctx.textAlign='right'; tctx.textBaseline='middle';
      tctx.fillText(n,bx0-9,y+FH/2);
    }
  }

  /* 楼顶灯 */
  var lampY=yOf(TOPN)-5;
  if(lampY>-10 && lampY<TH+10){
    var blink=0.45+0.55*Math.abs(Math.sin(Date.now()/500));
    tctx.fillStyle='rgba(255,233,168,'+blink.toFixed(2)+')';
    tctx.beginPath(); tctx.arc(bx0+bw*0.5,lampY,2.6,0,6.283); tctx.fill();
  }

  /* 地面 */
  var groundY=yOf(1)+FH/2+6;
  if(groundY<TH){
    var gg=tctx.createLinearGradient(0,groundY-8,0,TH);
    gg.addColorStop(0,'rgba(245,192,74,.10)');
    gg.addColorStop(0.25,'rgba(245,192,74,.02)');
    gg.addColorStop(1,'rgba(0,0,0,0)');
    tctx.fillStyle=gg;
    tctx.fillRect(bx0-30,groundY-8,bw+60,TH-groundY+8);
    tctx.strokeStyle='rgba(139,148,196,.4)';
    tctx.lineWidth=1;
    tctx.beginPath(); tctx.moveTo(0,groundY); tctx.lineTo(TW,groundY); tctx.stroke();
  }
}

/* 楼右侧住户头像 */
var avCache={};
function getAv(url){
  if(!url) return null;
  var c=avCache[url];
  if(!c){
    c={img:new Image(),ok:false};
    c.img.onload=function(){ c.ok=true; };
    c.img.src=url;
    avCache[url]=c;
  }
  return c;
}
function drawAvatars(){
  actx.clearRect(0,0,TW,TH);
  var cur=curFloorNow();
  var g=geom();
  var FH=g.FH, bx1=g.bx1, anchorY=g.anchorY;
  var nTopView=Math.ceil(anchorY/FH)+Math.ceil(cur);
  var nBotView=Math.floor(cur-(TH-anchorY)/FH)-1;
  var ax=(innerWidth<=760?bx1-14:bx1+14);
  var r=8;
  for(var n=Math.max(1,nBotView);n<=Math.min(nTopView,TOPN);n++){
    var f=BYN[n];
    if(!f||GONE[n]) continue;
    var y=anchorY+(cur-n)*FH;
    actx.save();
    actx.beginPath();
    actx.arc(ax,y,r,0,6.283);
    actx.fillStyle='#1C2450';
    actx.fill();
    var c=getAv(f.av);
    if(c&&c.ok&&c.img.width){
      actx.clip();
      var iw=c.img.width, ih=c.img.height, s=Math.min(iw,ih);
      actx.drawImage(c.img,(iw-s)/2,(ih-s)/2,s,s,ax-r,y-r,r*2,r*2);
    }
    actx.restore();
    actx.strokeStyle=LUCKY.indexOf(n)>=0?'rgba(245,192,74,.95)':'rgba(184,137,43,.55)';
    actx.lineWidth=1;
    actx.beginPath();
    actx.arc(ax,y,r,0,6.283);
    actx.stroke();
    if(n===Math.round(cur)){
      actx.strokeStyle='rgba(255,233,168,.95)';
      actx.lineWidth=1.5;
      actx.beginPath();
      actx.arc(ax,y,r+2.5,0,6.283);
      actx.stroke();
    }
  }
}
tc.addEventListener('click',function(e){
  var m=moonPos();
  var dx=e.clientX-m.x, dy=e.clientY-m.y;
  if(dx*dx+dy*dy < m.r*m.r*1.56){
    spawnMeteor();
    toast('对流星许愿之前，先把楼盖完');
    return;
  }
  var rect=tc.getBoundingClientRect();
  var g=geom();
  var y=e.clientY-rect.top;
  var n=Math.round(curFloorNow()-(y-g.anchorY)/g.FH);
  n=Math.max(1,Math.min(TOPN,n));
  scrollToFloor(n);
});

/* 左侧面板随楼层更新 */
var lastN=null;
function updatePanel(n){
  $('nowN').textContent=n;
  var tag=$('nowTag'), who=$('nowWho'), txt=$('nowTxt'), goneEl=$('nowGone');
  who.innerHTML=''; txt.textContent=''; goneEl.style.display='none';
  var label='', showTag=false;
  if(n>TOPN){
    label='还没盖到，虚位以待';
    showTag=true;
    txt.textContent='楼还在往上长。去帖子里回一条，这一层就是你的。';
  }else if(GONE[n]){
    label='已拆除';
    showTag=true;
    goneEl.style.display='block';
    goneEl.textContent='这一层的回复未按官方格式填写，按活动规则标记为拆除。';
  }else{
    var f=BYN[n];
    if(f){
      if(n===TOPN){ label='当前最高层'; showTag=true; }
      else if(n%100===0){ label='里程碑'; showTag=true; }
      else if(LUCKY.indexOf(n)>=0){ label='幸运层 · 麦克风奖位'; showTag=true; }
      else if(n===42){ label='宇宙的答案'; showTag=true; }
      var img=f.av?'<img src="'+f.av+'" onerror="this.style.display=\'none\'">':'';
      who.innerHTML=img+'<span class="nm">'+nameOf(f)+'</span><span class="tm">'+fmtT(f.t)+' 盖下</span>'+(f.lc?'<span class="lk">♥ '+f.lc+'</span>':'')+(f._v?'<span class="vbadge">有效模板层</span>':'');
      txt.textContent=(f.x||'').slice(0,84)||'这一层没有留言，灯为他亮着。';
    }
  }
  if(showTag){ tag.style.display='inline-block'; tag.textContent=label; }
  else{ tag.style.display='none'; }
}

/* 搜索 */
function doSearch(){
  var q=$('q').value.trim().toLowerCase();
  if(!q){ toast('先输入昵称'); return; }
  var hits=FLOORS.filter(function(f){
    return (f.u||'').toLowerCase().indexOf(q)>=0 || (f.nm||'').toLowerCase().indexOf(q)>=0;
  });
  if(!hits.length){ toast('没找到这位 Builder，检查一下昵称写法'); return; }
  var top=hits[hits.length-1].n;
  scrollToFloor(top);
  toast(nameOf(hits[0])+' 盖了 '+hits.length+' 层，带你去最高那层');
}

/* 幸运层按钮 */
function buildLucky(){
  var row=$('luckyRow');
  row.innerHTML='';
  LUCKY.forEach(function(n){
    var b=document.createElement('button');
    b.textContent='第 '+n+' 层';
    if(n<=TOPN) b.className='built';
    b.onclick=function(){
      if(n>TOPN){ toast('还没盖到第 '+n+' 层，正好去占这个奖位'); return; }
      scrollToFloor(n);
    };
    row.appendChild(b);
  });
}
buildLucky();

var rafPending=false;
function onScroll(){
  if(rafPending) return;
  rafPending=true;
  requestAnimationFrame(function(){
    rafPending=false;
    var fi=Math.round(curFloorNow());
    if(fi!==lastN){ lastN=fi; updatePanel(fi); }
  });
}
function loop(){
  drawStars();
  drawTower();
  drawAvatars();
  requestAnimationFrame(loop);
}
function onResize(){
  sizeBg(); sizeTower(); layoutSpace(); onScroll();
}
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('resize',onResize);
function applyData(d){
  if(!d||!d.floors||!d.floors.length) return;
  var sorted=d.floors.slice().sort(function(a,b){return a.n-b.n;});
  if(!sorted.length||sorted[0].n<1) return;
  var prevTop=TOPN;
  SNAPSHOT.floors=sorted;
  SNAPSHOT.posts_count=d.posts_count;
  SNAPSHOT.like_count=d.like_count;
  SNAPSHOT.views=d.views;
  SNAPSHOT.scraped_at=d.scraped_at||'';
  FLOORS.length=0;
  sorted.forEach(function(f){ FLOORS.push(f); f._v=VALID_RE.test(f.x||''); });
  for(var k in BYN) delete BYN[k];
  FLOORS.forEach(function(f){ BYN[f.n]=f; });
  TOPN=FLOORS[FLOORS.length-1].n;
  GONE.length=0;
  var have={};
  FLOORS.forEach(function(f){ have[f.n]=1; });
  for(var i=1;i<=TOPN;i++){ if(!have[i]) GONE[i]=1; }
  var s={}; FLOORS.forEach(function(f){ s[f.u]=1; });
  UNIQUE=Object.keys(s).length;
  VALID_N=FLOORS.filter(function(f){return f._v;}).length;
  layoutSpace(); sizeTower(); onScroll();
  refreshStats();
  buildLucky();
  if(lastN!=null) updatePanel(Math.min(lastN,TOPN));
  if(TOPN>prevTop) toast('数据已更新，现在盖到 '+TOPN+' 号楼');
}
sizeBg(); sizeTower(); layoutSpace();
lastN=Math.round(curFloorNow());
updatePanel(lastN);
loop();
if(location.protocol.indexOf('http')===0){
  fetch('/api/progress')
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){ applyData(d); })
    .catch(function(){});
}
</script>
